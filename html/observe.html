<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>旁路测试 · 风控系统</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tag-blue { color:#0958d9; background:#e6f4ff; }
  .tag-green { color:#0f8a3d; background:#e7f8ee; }
  .tag-red { color:#d03050; background:#fdeaea; }
  #ob-grid th.fix, #ob-grid td.fix { position: sticky; background:#fff; }
  #ob-grid thead th.fix { z-index:3; }
  #ob-grid .c1 { left:0; min-width:220px; } #ob-grid th.c1 { width:220px; }
  #ob-grid .cR { right:0; min-width:170px; } #ob-grid th.cR { width:170px; box-shadow:-6px 0 12px -12px rgba(10,50,46,.4); }
  #ob-grid td.fix, #ob-grid th.fix { z-index:2; }
  #ob-grid tbody tr:nth-child(even) td.fix { background:#f9fcfa; }
  #ob-grid tbody tr:hover td.fix { background:#eefaf7; }
  .hit-cell { line-height:1.7; }
  .hit-path-btn { font-size:11px; color:#0d9488; margin-left:6px; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .tag-approve { color:#389e0d; background:#f6ffed; border-color:#b7eb8f; }
  .btn-approve { color:#52c41a; }
  .kv-desc { border:1px solid #e7efed; border-radius:8px; overflow:hidden; }
  .kv-desc table { width:100%; border-collapse:collapse; font-size:13px; }
  .kv-desc td { padding:9px 12px; border-bottom:1px solid #eef3f2; vertical-align:top; }
  .kv-desc tr:nth-child(even) td { background:#f9fcfa; }
  .kv-desc td.k { width:130px; color:#6a8580; font-weight:600; background:#f7fbfa; }
  .kv-desc td.v2 { background:#fff9f4; }
</style>
</head>
<body data-page="observe">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="page-title" id="page-title"></div>

      <div class="filter-card">
        <div class="filter-row">
          <div class="filter-item"><span class="lab">选择节点</span>
            <select id="f-node" style="width:200px"><option value="">全部节点</option></select></div>
          <div class="filter-item"><span class="lab">开始时间</span>
            <input id="f-start" type="datetime-local" style="width:200px"></div>
          <div class="filter-item"><span class="lab">结束时间</span>
            <input id="f-end" type="datetime-local" style="width:200px"></div>
          <div class="filter-item"><span class="lab">搜索关键字</span>
            <input id="f-keyword" placeholder="账号ID" style="width:240px"></div>
          <div class="filter-item" style="align-self:flex-end">
            <button class="btn btn-primary" id="q-btn">查询</button>
          </div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="grid" id="ob-grid" style="min-width:1500px">
            <thead><tr>
              <th class="fix c1">请求ID</th><th>状态</th><th>账户</th><th>命中规则</th><th>场景名</th>
              <th>IP地址</th><th>IP省份</th><th>IP城市</th><th>ISP</th><th>分值</th><th>提交时间</th>
              <th class="fix cR">操作</th>
            </tr></thead>
            <tbody id="ob-body"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="total">共 0 条数据</span>
          <span>每页<select style="width:72px"><option>10</option><option>20</option><option>50</option></select></span>
          <span class="pager"><button disabled>‹</button><button class="on">1</button><button disabled>›</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 审核详情弹窗 -->
<div class="modal-mask" id="detail-modal">
  <div class="modal" style="max-width:820px">
    <div class="modal-head"><h3>审核详情</h3><button class="btn" data-close="detail-modal">×</button></div>
    <div class="modal-body" id="d-body"></div>
    <div class="modal-foot" id="d-foot"></div>
  </div>
</div>

<!-- 命中路径弹窗 -->
<div class="modal-mask" id="path-modal">
  <div class="modal" style="max-width:640px">
    <div class="modal-head"><h3>命中路径</h3><button class="btn" data-close="path-modal">×</button></div>
    <div class="modal-body" id="p-body"></div>
    <div class="modal-foot"><button class="btn btn-primary" data-close="path-modal">关闭</button></div>
  </div>
</div>

<!-- 拒绝原因弹窗 -->
<div class="modal-mask" id="reject-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-head"><h3>拒绝审核</h3><button class="btn" data-close="reject-modal">×</button></div>
    <div class="modal-body">
      <div style="font-size:13px;color:#263a35;margin-bottom:8px"><span style="color:#d03050;margin-right:2px">*</span>拒绝原因</div>
      <textarea id="reject-reason" rows="4" maxlength="200" placeholder="请输入拒绝原因" style="width:100%;height:96px;resize:none;border:1px solid #d9e4e1;border-radius:6px;padding:8px 10px;font-size:13px;outline:none"></textarea>
    </div>
    <div class="modal-foot"><button class="btn" data-close="reject-modal">取消</button><button class="btn btn-primary" id="confirm-reject">确定</button></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============ 旁路测试 · 静态演示数据 ============ */
(function () {
  const ROWS = [
    { reqId:'4cf082ba-a73d-11f1-866d-0ffb4f7ff8de', nodeNo:'TRANSACTION_PHONE_SDK', account:'138****001', scene:'手机端交易风控', ip:'171.109.*.*', prov:'广西', city:'南宁', isp:'中国电信', score:86, time:'2026-09-03 10:15:22', status:'pending',
      hits:[['1天支付金额大于50000','手机端交易风控 / 交易金额策略 / 1天支付金额大于50000'],['1小时支付笔数大于30','手机端交易风控 / 支付频次策略 / 1小时支付笔数大于30']] },
    { reqId:'b9a2f0d1-3e55-4f21-ba0c-8d9f1e2a77c1', nodeNo:'TRANSACTION_PHONE_SDK', account:'188****672', scene:'手机端交易风控', ip:'120.229.*.*', prov:'广东', city:'广州', isp:'电信', score:62, time:'2026-09-03 10:12:47', status:'approved',
      hits:[['1小时支付笔数大于30','手机端交易风控 / 支付频次策略 / 1小时支付笔数大于30']] },
    { reqId:'7c1e8a90-1d2b-4c3f-9e4d-5a6f7b8c9d0e', nodeNo:'LOGIN_WEB', account:'139****508', scene:'登录风控', ip:'223.104.*.*', prov:'广东', city:'深圳', isp:'移动', score:91, time:'2026-09-03 09:58:03', status:'pending',
      hits:[['设备黑名单命中','登录风控 / 登录设备策略 / 设备黑名单命中']] },
    { reqId:'a1b2c3d4-5e6f-7890-abcd-ef1234567890', nodeNo:'LOGIN_WEB', account:'186****245', scene:'登录风控', ip:'61.140.*.*', prov:'广东', city:'广州', isp:'电信', score:58, time:'2026-09-03 09:20:55', status:'rejected',
      hits:[['3小时异常IP登录次数大于5','登录风控 / 异常IP登录策略 / 3小时异常IP登录次数大于5']] },
    { reqId:'d7e8f9a0-b1c2-4d3e-8f0a-1b2c3d4e5f60', nodeNo:'TRANSACTION_PHONE_SDK', account:'186****113', scene:'手机端交易风控', ip:'113.65.*.*', prov:'广东', city:'东莞', isp:'电信', score:93, time:'2026-09-03 08:52:10', status:'pending',
      hits:[['1天支付金额大于50000','手机端交易风控 / 交易金额策略 / 1天支付金额大于50000']] },
    { reqId:'7f0e9d8c-7b6a-5948-4736-2514a3b2c1d0', nodeNo:'LOGIN_WEB', account:'139****508', scene:'登录风控', ip:'223.104.*.*', prov:'广东', city:'深圳', isp:'移动', score:88, time:'2026-09-03 07:26:18', status:'approved',
      hits:[['设备黑名单命中','登录风控 / 登录设备策略 / 设备黑名单命中'],['3小时异常IP登录次数大于5','登录风控 / 异常IP登录策略 / 3小时异常IP登录次数大于5']] },
    { reqId:'b4c5d6e7-f8a9-4b0c-8d1e-2f3a4b5c6d7e', nodeNo:'PAY_ANDROID_SDK', account:'138****031', scene:'手机端交易风控', ip:'58.62.*.*', prov:'广东', city:'广州', isp:'联通', score:64, time:'2026-09-03 06:58:02', status:'pending',
      hits:[['1小时支付笔数大于30','手机端交易风控 / 支付频次策略 / 1小时支付笔数大于30']] },
    { reqId:'f61ee1a0-33b2-44a1-9d2e-c2a1b3d4e5f6', nodeNo:'LOGIN_WEB', account:'158****901', scene:'登录风控', ip:'120.244.*.*', prov:'北京', city:'北京', isp:'联通', score:12, time:'2026-09-03 09:02:11', status:'approved',
      hits:[] },
    { reqId:'a99f2b3c-4d5e-4f6a-9b0c-1d2e3f4a5b6c', nodeNo:'LOGIN_API', account:'139****770', scene:'登录风控', ip:'117.136.*.*', prov:'河南', city:'郑州', isp:'移动', score:81, time:'2026-09-03 08:47:59', status:'pending',
      hits:[['设备黑名单命中','登录风控 / 登录设备策略 / 设备黑名单命中']] },
  ];
  const STATUS = {
    pending: ['待审核', 'tag-blue'], approved: ['已通过', 'tag-green'], rejected: ['已拒绝', 'tag-red'],
  };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  const nodeSel = document.getElementById('f-node');
  DEMO.nodes.forEach(n => { const o = document.createElement('option'); o.value = n.nodeNo; o.textContent = n.nodeName; nodeSel.appendChild(o); });
  document.getElementById('f-start').value = '2026-09-03T00:00';
  document.getElementById('f-end').value = '2026-09-03T23:59';

  function hitsCell(hits) {
    if (!hits.length) return '<span class="muted">-</span>';
    return hits.map(h => `<div class="hit-cell"><span>${esc(h[0])}</span>
      <span class="hit-path-btn link" data-path="${esc(h[1])}" data-rule="${esc(h[0])}">[路径]</span></div>`).join('');
  }
  function rowHtml(r, idx) {
    const st = STATUS[r.status];
    const act = r.status === 'pending'
      ? `<button class="btn-link btn-approve" data-act="approve" data-i="${idx}">通过</button>
         <button class="btn-link danger" data-act="reject" data-i="${idx}">拒绝</button>`
      : '';
    return `<tr>
      <td class="fix c1 mono">${esc(r.reqId)}</td>
      <td><span class="tag ${st[1]}">${st[0]}</span></td>
      <td>${esc(r.account)}</td>
      <td style="max-width:300px">${hitsCell(r.hits)}</td>
      <td>${esc(r.scene)}</td>
      <td class="mono">${esc(r.ip)}</td>
      <td>${esc(r.prov)}</td><td>${esc(r.city)}</td><td>${esc(r.isp)}</td>
      <td class="num">${r.score}</td>
      <td>${esc(r.time)}</td>
      <td class="fix cR td-actions"><button class="btn-link" data-i="${idx}" data-role="detail">详情</button>${act}</td>
    </tr>`;
  }
  function renderRows(list) {
    document.getElementById('ob-body').innerHTML = list.map(r => rowHtml(r, ROWS.indexOf(r))).join('');
    document.getElementById('total').textContent = '共 ' + list.length + ' 条数据';
  }

  function descRow(k, v) { return `<tr><td class="k">${k}</td><td colspan="3">${v}</td></tr>`; }

  function openDetail(idx) {
    const r = ROWS[idx];
    const pending = r.status === 'pending';
    document.getElementById('d-body').innerHTML = `
      <div style="margin-bottom:12px">
        <span class="tag tag-blue">风险决策</span>
        <span class="tag tag-gray" style="margin-left:6px">旁路观测模式</span>
        <span class="mono" style="float:right;font-size:12px;color:#9fb5b1">${esc(r.reqId)}</span>
      </div>
      <div class="kv-desc"><table>
        ${descRow('信息类别', '<span class="tag tag-blue">风险决策</span>')}
        ${descRow('数据来源', '旁路测试 · 观察模式')}
        ${descRow('风险等级', `<span class="tag ${r.score >= 80 ? 'tag-red' : r.score >= 50 ? 'tag-orange' : 'tag-green'}">${r.score >= 80 ? '高' : r.score >= 50 ? '中' : '低'}风险</span>`)}
        ${descRow('说明', `账户: ${esc(r.account)} · 评分: ${r.score}<br>命中规则: ${r.hits.length ? r.hits.map(h => esc(h[0])).join('、') : '无'}`)}
        ${descRow('人员 / 提交时间', '系统 · ' + esc(r.time))}
        ${descRow('审核状态', `<span class="tag ${STATUS[r.status][1]}">${STATUS[r.status][0]}</span>`)}
        ${descRow('审核时间', r.status === 'pending' ? '-' : (r.status === 'approved' ? '2026-09-03 11:02:41' : '2026-09-03 09:58:41'))}
        ${descRow('审核人 / 审核意见', r.status === 'pending' ? '-' : (r.status === 'approved' ? '管理员 · 观察结果符合预期，通过' : '管理员 · 误报可能较高，拒绝'))}
      </table></div>`;
    document.getElementById('d-foot').innerHTML = pending
      ? `<button class="btn" data-close="detail-modal">取消</button>
         <button class="btn" style="border-color:#d03050;color:#d03050" data-act="reject" data-i="${idx}">拒绝</button>
         <button class="btn btn-primary" data-act="approve" data-i="${idx}">通过</button>`
      : `<button class="btn btn-primary" data-close="detail-modal">关闭</button>`;
    openModal('detail-modal');
  }

  function setStatus(idx, st) {
    ROWS[idx].status = st;
    closeModal('detail-modal');
    closeModal('reject-modal');
    renderRows(ROWS);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-i]');
    if (el && el.dataset.role === 'detail') { openDetail(+el.dataset.i); return; }
    if (el && el.dataset.act === 'approve') {
      const r = ROWS[+el.dataset.i];
      if (confirm(`确定通过该笔观测记录（${r.reqId}）吗？`)) setStatus(+el.dataset.i, 'approved');
      return;
    }
    if (el && el.dataset.act === 'reject') {
      window._rejectIdx = +el.dataset.i;
      closeModal('detail-modal');
      openModal('reject-modal');
      return;
    }
    const p = e.target.closest('.hit-path-btn');
    if (p) {
      document.getElementById('p-body').innerHTML =
        `<div style="margin-bottom:10px"><span class="tag tag-teal">${esc(p.dataset.rule)}</span></div>
         <div class="kv-block"><div class="k">决策链路</div><div class="v">${esc(p.dataset.path)}</div></div>`;
      openModal('path-modal');
    }
  });
  document.getElementById('confirm-reject').onclick = () => {
    if (window._rejectIdx !== undefined) setStatus(window._rejectIdx, 'rejected');
  };

  document.getElementById('q-btn').onclick = () => {
    const node = nodeSel.value;
    const kw = document.getElementById('f-keyword').value.trim();
    const s = document.getElementById('f-start').value.replace('T',' ');
    const e = document.getElementById('f-end').value.replace('T',' ');
    renderRows(ROWS.filter(r =>
      (!node || r.nodeNo === node) && (!kw || r.account.indexOf(kw) >= 0) &&
      (!s || r.time >= s) && (!e || r.time <= e)));
  };

  renderRows(ROWS);
})();
</script>
</body>
</html>
