<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风控策略 · 风控系统</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tag-green { color:#0f8a3d; background:#e7f8ee; }
  .tag-gray2 { color:#5b7470; background:#eef2f1; }
  .tag-orange { color:#c2580a; background:#fdf1e3; }
  .tag-red { color:#d03050; background:#fdeaea; }
  .code-muted { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:#9fb5b1; }
</style>
</head>
<body data-page="strategies">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="page-title" id="page-title"></div>

      <div class="filter-card" style="padding:10px 16px">
        <div class="filter-row" style="gap:12px">
          <div class="filter-item" style="flex-direction:row;align-items:center"><span class="lab">所属场景</span>
            <select id="f-scene" style="width:200px"><option value="">全部场景</option></select></div>
          <input id="f-kw" placeholder="搜索策略名称 / 编码" style="width:240px">
          <button class="btn btn-primary" id="q-btn" style="align-self:center">查询</button>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <button class="btn btn-primary" data-open="st-modal">＋ 新增策略</button>
          </span>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="grid" style="min-width:1180px">
            <thead><tr>
              <th style="width:200px">策略名称</th><th style="width:220px">所属场景</th><th style="width:110px">规则数</th>
              <th style="width:130px">策略动作</th><th style="width:130px">7日命中</th><th style="width:90px">状态</th>
              <th style="width:160px">更新时间</th><th style="width:190px">操作</th>
            </tr></thead>
            <tbody id="st-body"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="st-total">共 0 条</span>
          <span class="pager"><button disabled>‹</button><button class="on">1</button><button disabled>›</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="st-modal">
  <div class="modal" style="max-width:560px">
    <div class="modal-head"><h3 id="stm-title">新增策略</h3><button class="btn" data-close="st-modal">×</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="lab" style="color:#263a35">策略名称 <b style="color:#d03050">*</b></div><input id="m-name" placeholder="如 交易金额策略"></div>
        <div><div class="lab" style="color:#263a35">策略编码 <b style="color:#d03050">*</b></div><input id="m-code" placeholder="如 AMT_STRATEGY"></div>
        <div><div class="lab" style="color:#263a35">所属场景 <b style="color:#d03050">*</b></div><select id="m-scene"></select></div>
        <div><div class="lab" style="color:#263a35">策略动作（决策码）</div>
          <select id="m-dec"><option value="REJECT">拒绝 (REJECT)</option><option value="REVIEW">审核 (REVIEW)</option><option value="PASS">通过 (PASS)</option></select></div>
        <div style="grid-column:1/3"><div class="lab" style="color:#263a35">备注</div><input id="m-desc"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="st-modal">取消</button><button class="btn btn-primary" id="stm-save">保存</button></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============ 风控策略 · 静态演示数据 ============ */
(function () {
  const D = [
    { name:'交易金额策略', code:'AMT_STRATEGY', scene:'手机端交易风控', rules:2, dec:'REJECT', hits:1420, st:'启用', time:'2026-08-20 10:12:00', desc:'单笔/累计金额超限' },
    { name:'支付频次策略', code:'PAY_FREQ_STRATEGY', scene:'手机端交易风控', rules:2, dec:'REVIEW', hits:760, st:'启用', time:'2026-08-20 10:18:33', desc:'短时高频支付' },
    { name:'登录设备策略', code:'DEV_STRATEGY', scene:'登录风控', rules:2, dec:'REJECT', hits:612, st:'启用', time:'2026-08-15 09:40:10', desc:'设备黑名单/异常设备' },
    { name:'异常IP登录策略', code:'ABN_IP_STRATEGY', scene:'登录风控', rules:1, dec:'REVIEW', hits:231, st:'启用', time:'2026-08-16 14:22:45', desc:'高频异常 IP 登录' },
    { name:'接口频控策略', code:'API_QPS_STRATEGY', scene:'开放接口限流', rules:1, dec:'REJECT', hits:189, st:'启用', time:'2026-07-02 11:05:09', desc:'B 端接口 QPS 限流' },
  ];
  const DEC_TAG = { REJECT:['拒绝','tag-red'], REVIEW:['审核','tag-orange'], PASS:['通过','tag-green'] };
  const SCENES = ['手机端交易风控','登录风控','开放接口限流','支付风控','交易风险监控'];
  const sceneSel = document.getElementById('f-scene');
  const sceneM = document.getElementById('m-scene');
  SCENES.forEach(s => { [sceneSel, sceneM].forEach(el => { const o = document.createElement('option'); o.value = s; o.textContent = s; el.appendChild(o); }); });
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  function rowHtml(st, i) {
    const d = DEC_TAG[st.dec];
    return `<tr data-i="${i}">
      <td><div style="font-weight:600;color:#17423c">${esc(st.name)}</div><div class="code-muted">${esc(st.code)}</div></td>
      <td>${esc(st.scene)}</td>
      <td class="num">${st.rules}</td>
      <td><span class="tag ${d[1]}">${st.dec} · ${d[0]}</span></td>
      <td class="num">${st.hits.toLocaleString()}</td>
      <td><span class="tag ${st.st === '启用' ? 'tag-green' : 'tag-gray2'}">${st.st}</span></td>
      <td>${esc(st.time)}</td>
      <td class="td-actions">
        <a class="btn-link" href="rules.html?scene=${encodeURIComponent(st.scene)}">规则列表</a>
        <button class="btn-link" data-e="${i}">编辑</button>
        <button class="btn-link danger" data-d="${i}">删除</button>
      </td>
    </tr>`;
  }
  function render(list) {
    document.getElementById('st-body').innerHTML = list.map(s => rowHtml(s, D.indexOf(s))).join('');
    document.getElementById('st-total').textContent = '共 ' + list.length + ' 条';
  }
  function fullRender() { render(D); }
  function applyFilter() {
    const kw = document.getElementById('f-kw').value.trim().toLowerCase();
    const sc = sceneSel.value;
    render(D.filter(s => (!sc || s.scene === sc) && (!kw || s.name.toLowerCase().includes(kw) || s.code.toLowerCase().includes(kw))));
  }
  document.getElementById('q-btn').onclick = applyFilter;
  document.getElementById('f-kw').addEventListener('input', applyFilter);
  sceneSel.onchange = applyFilter;

  let _edit = -1;
  function openForm(idx) {
    _edit = idx;
    document.getElementById('stm-title').textContent = idx === -1 ? '新增策略' : '编辑策略';
    const s = idx === -1 ? {} : D[idx];
    document.getElementById('m-name').value = s.name || '';
    document.getElementById('m-code').value = s.code || '';
    document.getElementById('m-scene').value = s.scene || SCENES[0];
    document.getElementById('m-dec').value = s.dec || 'REJECT';
    document.getElementById('m-desc').value = s.desc || '';
    openModal('st-modal');
  }
  document.querySelector('[data-open="st-modal"]').addEventListener('click', () => openForm(-1));
  document.getElementById('stm-save').onclick = () => {
    const name = document.getElementById('m-name').value.trim();
    const code = document.getElementById('m-code').value.trim();
    if (!name || !code) { alert('策略名称与编码不能为空'); return; }
    const v = { name, code, scene: document.getElementById('m-scene').value, rules: 0, dec: document.getElementById('m-dec').value,
      hits: 0, st: '启用', time: '2026-09-03 16:30:00', desc: document.getElementById('m-desc').value.trim() };
    if (_edit === -1) D.push(v); else D[_edit] = v;
    closeModal('st-modal'); fullRender();
  };

  document.addEventListener('click', e => {
    const ed = e.target.closest('[data-e]'); if (ed) { openForm(+ed.dataset.e); return; }
    const del = e.target.closest('[data-d]');
    if (del) { const s = D[+del.dataset.d]; if (confirm(`确认删除策略「${s.name}」？`)) { D.splice(+del.dataset.d, 1); fullRender(); } }
  });

  fullRender();
})();
</script>
</body>
</html>
