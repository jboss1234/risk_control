<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>角色配置 · 风控系统</title>
<link rel="stylesheet" href="assets/styles.css">
<style>.code-mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#0f766e;}.tag-blue{color:#0958d9;background:#e6f4ff}.tag-green{color:#0f8a3d;background:#e7f8ee}</style>
</head>
<body data-page="roles">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="page-title" id="page-title"></div>
      <div class="filter-card" style="padding:10px 16px">
        <div class="filter-row" style="gap:12px">
          <input id="f-kw" placeholder="搜索角色名称 / 编码" style="width:240px">
          <button class="btn btn-primary" id="q-btn" style="align-self:center">查询</button>
          <span style="margin-left:auto"><button class="btn btn-primary" data-open="role-modal">＋ 新增角色</button></span>
        </div>
      </div>
      <div class="table-card">
        <div class="table-scroll">
          <table class="grid" style="min-width:1000px">
            <thead><tr><th style="width:170px">角色名称</th><th style="width:200px">角色编码</th><th style="width:110px">权限数</th><th style="width:100px">用户数</th><th>说明</th><th style="width:130px">创建时间</th><th style="width:170px">操作</th></tr></thead>
            <tbody id="role-body"></tbody>
          </table>
        </div>
        <div class="table-foot"><span id="role-total">共 0 条</span><span class="pager"><button disabled>‹</button><button class="on">1</button><button disabled>›</button></span></div>
      </div>
    </div>
  </div>
</div>
<div class="modal-mask" id="role-modal">
  <div class="modal" style="max-width:540px">
    <div class="modal-head"><h3 id="rolem-title">新增角色</h3><button class="btn" data-close="role-modal">×</button></div>
    <div class="modal-body">
      <div class="lab" style="color:#263a35">角色名称 <b style="color:#d03050">*</b></div><input id="m-name">
      <div class="lab" style="color:#263a35;margin-top:10px">角色编码 <b style="color:#d03050">*</b></div><input id="m-code">
      <div class="lab" style="color:#263a35;margin-top:10px">说明</div><textarea id="m-desc" rows="3" style="width:100%;resize:none"></textarea>
    </div>
    <div class="modal-foot"><button class="btn" data-close="role-modal">取消</button><button class="btn btn-primary" id="rolem-save">保存</button></div>
  </div>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function () {
  const D = [
    { name:'超级管理员', code:'SUPER_ADMIN', perms:30, users:1, desc:'全部权限，不随角色调整', time:'2026-05-01 00:00:00', builtin:true },
    { name:'风控运营', code:'RISK_OPERATOR', perms:22, users:4, desc:'规则策略配置与审核处理', time:'2026-06-10 10:00:00', builtin:false },
    { name:'风控查看', code:'RISK_VIEWER', perms:12, users:6, desc:'仅查看大盘与查询类页面', time:'2026-06-10 10:05:00', builtin:false },
    { name:'名单管理员', code:'LIST_ADMIN', perms:10, users:2, desc:'名单库/宽表维护', time:'2026-07-02 14:20:00', builtin:false },
  ];
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  function rowHtml(r, i){ return `<tr data-i="${i}"><td style="font-weight:600;color:#17423c">${esc(r.name)} ${r.builtin ? '<span class="tag tag-blue" style="margin-left:4px">内置</span>' : ''}</td><td><span class="code-mono">${esc(r.code)}</span></td><td class="num">${r.perms}</td><td class="num">${r.users}</td><td style="color:#41605b">${esc(r.desc)}</td><td>${esc(r.time)}</td><td class="td-actions"><button class="btn-link" data-e="${i}">编辑</button>${r.builtin ? '' : `<button class="btn-link danger" data-d="${i}">删除</button>`}</td></tr>`; }
  function render(list){ document.getElementById('role-body').innerHTML = list.map(r => rowHtml(r, D.indexOf(r))).join(''); document.getElementById('role-total').textContent = '共 ' + list.length + ' 条'; }
  function fullRender(){ render(D); }
  document.getElementById('f-kw').addEventListener('input', function(){ const kw = this.value.trim().toLowerCase(); render(D.filter(r => !kw || r.name.toLowerCase().includes(kw) || r.code.toLowerCase().includes(kw))); });
  document.getElementById('q-btn').onclick = () => document.getElementById('f-kw').dispatchEvent(new Event('input'));
  let _e = -1;
  function openForm(i){ _e = i; const r = i === -1 ? {} : D[i];
    document.getElementById('rolem-title').textContent = i === -1 ? '新增角色' : '编辑角色';
    document.getElementById('m-name').value = r.name||''; document.getElementById('m-code').value = r.code||''; document.getElementById('m-desc').value = r.desc||''; openModal('role-modal'); }
  document.querySelector('[data-open="role-modal"]').addEventListener('click', () => openForm(-1));
  document.getElementById('rolem-save').onclick = () => { const name = document.getElementById('m-name').value.trim(), code = document.getElementById('m-code').value.trim();
    if (!name || !code) { alert('名称与编码必填'); return; }
    const v = { name, code, perms: _e === -1 ? 0 : D[_e].perms, users: _e === -1 ? 0 : D[_e].users, desc: document.getElementById('m-desc').value.trim(), time: '2026-09-03 17:00:00', builtin:false };
    if (_e === -1) D.push(v); else D[_e] = v; closeModal('role-modal'); fullRender(); };
  document.addEventListener('click', e => {
    const ed = e.target.closest('[data-e]'); if (ed) { openForm(+ed.dataset.e); return; }
    const del = e.target.closest('[data-d]'); if (del) { const r = D[+del.dataset.d]; if (confirm(`确认删除角色「${r.name}」？`)) { D.splice(+del.dataset.d,1); fullRender(); } } });
  fullRender();
})();
</script>
</body>
</html>
