<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风控场景 · 风控系统</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tag-green { color:#0f8a3d; background:#e7f8ee; }
  .tag-gray2 { color:#5b7470; background:#eef2f1; }
  .code-muted { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:#9fb5b1; }
</style>
</head>
<body data-page="scenes">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="page-title" id="page-title"></div>

      <div class="filter-card" style="padding:10px 16px">
        <div class="filter-row" style="gap:12px">
          <div class="filter-item" style="flex-direction:row;align-items:center"><span class="lab">所属节点</span>
            <select id="f-node" style="width:200px"><option value="">全部</option></select></div>
          <input id="f-kw" placeholder="搜索场景名称" style="width:240px">
          <button class="btn btn-primary" id="q-btn" style="align-self:center">查询</button>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <button class="btn btn-primary" data-open="sc-modal">＋ 新增场景</button>
          </span>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="grid" style="min-width:1150px">
            <thead><tr>
              <th style="width:220px">场景名称</th><th style="width:190px">所属节点</th><th style="width:110px">规则数</th>
              <th style="width:130px">7日命中</th><th style="width:110px">命中率</th><th style="width:90px">状态</th>
              <th style="width:160px">创建时间</th><th style="width:200px">操作</th>
            </tr></thead>
            <tbody id="sc-body"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="sc-total">共 0 条</span>
          <span class="pager"><button disabled>‹</button><button class="on">1</button><button disabled>›</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="sc-modal">
  <div class="modal" style="max-width:560px">
    <div class="modal-head"><h3 id="scm-title">新增场景</h3><button class="btn" data-close="sc-modal">×</button></div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="lab" style="color:#263a35">场景名称 <b style="color:#d03050">*</b></div><input id="m-name"></div>
        <div><div class="lab" style="color:#263a35">所属节点 <b style="color:#d03050">*</b></div><select id="m-node"></select></div>
        <div style="grid-column:1/3"><div class="lab" style="color:#263a35">场景描述</div>
          <textarea id="m-desc" rows="3" style="width:100%;height:70px;resize:none"></textarea></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="sc-modal">取消</button><button class="btn btn-primary" id="scm-save">保存</button></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============ 风控场景 · 静态演示数据 ============ */
(function () {
  const D = [
    { name:'手机端交易风控', node:'TRANSACTION_PHONE_SDK', rules:8, hits:1874, rate:'1.46%', st:'启用', time:'2026-05-12 10:20:11', desc:'手机 SDK 支付交易主场景' },
    { name:'登录风控', node:'LOGIN_WEB', rules:6, hits:964, rate:'0.72%', st:'启用', time:'2026-06-03 09:15:00', desc:'Web 登录风险识别' },
    { name:'开放接口限流', node:'LOGIN_API', rules:4, hits:212, rate:'0.13%', st:'启用', time:'2026-06-18 14:02:36', desc:'B 端接口频控限流' },
    { name:'支付风控', node:'PAY_ANDROID_SDK', rules:7, hits:1201, rate:'1.12%', st:'启用', time:'2026-07-01 11:44:20', desc:'安卓支付通道风控' },
    { name:'交易风险监控', node:'BYPAAS_TRADE', rules:3, hits:0, rate:'0.00%', st:'停用', time:'2026-08-10 16:30:09', desc:'旁路观测场景，仅记录' },
  ];
  const nodeSel = document.getElementById('f-node');
  const nodeM = document.getElementById('m-node');
  DEMO.nodes.forEach(n => { [nodeSel, nodeM].forEach(s => { const o = document.createElement('option'); o.value = n.nodeNo; o.textContent = n.nodeName; s.appendChild(o); }); });
  const ND = n => n ? ((DEMO.nodes.find(x => x.nodeNo === n) || {}).nodeName || n) : '全部节点';
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  function rowHtml(s, i) {
    return `<tr data-i="${i}">
      <td><div style="font-weight:600;color:#17423c">${esc(s.name)}</div></td>
      <td>${ND(s.node)}</td>
      <td class="num">${s.rules}</td>
      <td class="num">${s.hits.toLocaleString()}</td>
      <td class="num">${s.rate}</td>
      <td><span class="tag ${s.st === '启用' ? 'tag-green' : 'tag-gray2'}">${s.st}</span></td>
      <td>${esc(s.time)}</td>
      <td class="td-actions">
        <a class="btn-link" href="rules.html?scene=${encodeURIComponent(s.name)}&node=${s.node}">查看规则</a>
        <button class="btn-link" data-e="${i}">编辑</button>
        <button class="btn-link danger" data-d="${i}">删除</button>
      </td>
    </tr>`;
  }
  function render(list) {
    document.getElementById('sc-body').innerHTML = list.map(s => rowHtml(s, D.indexOf(s))).join('');
    document.getElementById('sc-total').textContent = '共 ' + list.length + ' 条';
  }
  function fullRender() { render(D); }

  function applyFilter() {
    const kw = document.getElementById('f-kw').value.trim().toLowerCase();
    const nd = nodeSel.value;
    render(D.filter(s => (!nd || s.node === nd) && (!kw || s.name.toLowerCase().includes(kw))));
  }
  document.getElementById('q-btn').onclick = applyFilter;
  document.getElementById('f-kw').addEventListener('input', applyFilter);
  nodeSel.onchange = applyFilter;

  let _edit = -1;
  function openForm(idx) {
    _edit = idx;
    document.getElementById('scm-title').textContent = idx === -1 ? '新增场景' : '编辑场景';
    const s = idx === -1 ? {} : D[idx];
    document.getElementById('m-name').value = s.name || '';
    document.getElementById('m-node').value = s.node || '';
    document.getElementById('m-desc').value = s.desc || '';
    openModal('sc-modal');
  }
  document.querySelector('[data-open="sc-modal"]').addEventListener('click', () => openForm(-1));
  document.getElementById('scm-save').onclick = () => {
    const name = document.getElementById('m-name').value.trim();
    if (!name) { alert('场景名称不能为空'); return; }
    const v = { name, node: document.getElementById('m-node').value, rules: 0, hits: 0, rate: '0.00%',
      st: '启用', time: '2026-09-03 16:30:00', desc: document.getElementById('m-desc').value.trim() };
    if (_edit === -1) D.push(v); else D[_edit] = v;
    closeModal('sc-modal'); fullRender();
  };

  document.addEventListener('click', e => {
    const ed = e.target.closest('[data-e]'); if (ed) { openForm(+ed.dataset.e); return; }
    const del = e.target.closest('[data-d]');
    if (del) { const s = D[+del.dataset.d]; if (confirm(`确认删除场景「${s.name}」？`)) { D.splice(+del.dataset.d, 1); fullRender(); } }
  });

  fullRender();
})();
</script>
</body>
</html>
