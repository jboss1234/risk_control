<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>宽表查询 · 风控系统</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .tag-green { color:#0f8a3d; background:#e7f8ee; }
  .mono2 { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .kvt { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
</style>
</head>
<body data-page="wide-table">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="page-title" id="page-title"></div>

      <div class="filter-card" style="padding:10px 16px">
        <div class="filter-row" style="gap:12px">
          <div class="filter-item" style="flex-direction:row;align-items:center"><span class="lab">节点</span>
            <select id="f-node" style="width:180px"><option value="">全部</option></select></div>
          <input id="f-kw" placeholder="搜索 请求ID / 账号 / IP" style="width:280px">
          <button class="btn btn-primary" id="q-btn" style="align-self:center">查询</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="grid" style="min-width:1500px">
            <thead><tr>
              <th style="width:220px">请求ID</th><th style="width:110px">事件类型</th><th style="width:160px">事件时间</th>
              <th style="width:130px">账号</th><th style="width:140px">设备ID</th><th style="width:130px">IP地址</th><th style="width:110px">省份</th>
              <th>近1h支付金额</th><th>近24h购买次数</th><th>近24h去重IP</th><th>设备黑名单</th><th style="width:100px">操作</th>
            </tr></thead>
            <tbody id="wt-body"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="wt-total">共 0 条</span>
          <span class="pager"><button disabled>‹</button><button class="on">1</button><button disabled>›</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="wt-modal">
  <div class="modal" style="max-width:900px">
    <div class="modal-head"><h3>宽表记录详情</h3><button class="btn" data-close="wt-modal">×</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:#9fb5b1;margin-bottom:10px" id="wt-title"></div>
      <div class="kvt" id="wt-fields"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-close="wt-modal">关闭</button></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============ 宽表查询 · 静态演示数据 ============ */
(function () {
  const D = [
    { id:'4cf082ba-a73d-11f1-866d-0ffb4f7ff8de', type:'支付', node:'TRANSACTION_PHONE_SDK', time:'2026-09-03 10:15:22', acc:'138****001', dev:'123131****c88d', ip:'171.109.216.30', prov:'广西', amt1h:12999, cnt24h:4, ip24h:3, black:'否' },
    { id:'7c1e8a90-1d2b-4c3f-9e4d-5a6f7b8c9d0e', type:'登录', node:'LOGIN_WEB', time:'2026-09-03 09:58:03', acc:'139****508', dev:'9ab1****c88d', ip:'223.104.66.12', prov:'广东', amt1h:0, cnt24h:0, ip24h:8, black:'是' },
    { id:'b9a2f0d1-3e55-4f21-ba0c-8d9f1e2a77c1', type:'支付', node:'TRANSACTION_PHONE_SDK', time:'2026-09-03 10:12:47', acc:'188****672', dev:'86f2****aa91', ip:'120.229.85.44', prov:'广东', amt1h:648, cnt24h:7, ip24h:5, black:'否' },
    { id:'a1b2c3d4-5e6f-7890-abcd-ef1234567890', type:'登录', node:'LOGIN_WEB', time:'2026-09-03 09:20:55', acc:'186****245', dev:'77ab****12cd', ip:'61.140.190.28', prov:'广东', amt1h:0, cnt24h:0, ip24h:6, black:'否' },
    { id:'d7e8f9a0-b1c2-4d3e-8f0a-1b2c3d4e5f60', type:'支付', node:'TRANSACTION_PHONE_SDK', time:'2026-09-03 08:52:10', acc:'186****113', dev:'5e6f****c0ab', ip:'113.65.66.19', prov:'广东', amt1h:20000, cnt24h:9, ip24h:6, black:'否' },
    { id:'b4c5d6e7-f8a9-4b0c-8d1e-2f3a4b5c6d7e', type:'支付', node:'PAY_ANDROID_SDK', time:'2026-09-03 06:58:02', acc:'138****031', dev:'c8a9****21ef', ip:'58.62.12.30', prov:'广东', amt1h:648, cnt24h:11, ip24h:4, black:'否' },
    { id:'f61ee1a0-33b2-44a1-9d2e-c2a1b3d4e5f6', type:'登录', node:'LOGIN_API', time:'2026-09-03 09:02:11', acc:'158****901', dev:'b011****90aa', ip:'120.244.100.9', prov:'北京', amt1h:0, cnt24h:0, ip24h:1, black:'否' },
    { id:'8c1d9e0f-1a2b-3c4d-8e9f-0a1b2c3d4e5f', type:'支付', node:'TRANSACTION_PHONE_SDK', time:'2026-09-03 08:20:33', acc:'188****456', dev:'3f2e****7721', ip:'14.215.177.38', prov:'广东', amt1h:1980, cnt24h:5, ip24h:2, black:'否' },
  ];
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const nodeSel = document.getElementById('f-node');
  DEMO.nodes.forEach(n => { const o = document.createElement('option'); o.value = n.nodeNo; o.textContent = n.nodeName; nodeSel.appendChild(o); });
  const ND = n => n ? ((DEMO.nodes.find(x => x.nodeNo === n) || {}).nodeName || n) : '-';

  function rowHtml(w, i) {
    return `<tr data-i="${i}">
      <td class="mono2" style="font-size:12px">${esc(w.id)}</td>
      <td><span class="tag ${w.type === '登录' ? 'tag-teal' : 'tag-green'}">${w.type}</span></td>
      <td>${esc(w.time)}</td>
      <td>${esc(w.acc)}</td>
      <td class="mono2">${esc(w.dev)}</td>
      <td class="mono2">${esc(w.ip)}</td>
      <td>${esc(w.prov)}</td>
      <td class="num">${w.amt1h ? '¥ ' + w.amt1h.toLocaleString() : '<span class="muted">-</span>'}</td>
      <td class="num">${w.cnt24h}</td>
      <td class="num">${w.ip24h}</td>
      <td>${w.black === '是' ? '<span class="tag tag-red" style="color:#d03050;background:#fdeaea">是</span>' : '<span class="tag tag-gray2">否</span>'}</td>
      <td class="td-actions"><button class="btn-link" data-i="${i}">查看明细</button></td>
    </tr>`;
  }
  function render(list) {
    document.getElementById('wt-body').innerHTML = list.map(w => rowHtml(w, D.indexOf(w))).join('');
    document.getElementById('wt-total').textContent = '共 ' + list.length + ' 条';
  }
  function fullRender() { render(D); }
  function apply() {
    const kw = document.getElementById('f-kw').value.trim().toLowerCase();
    const nd = nodeSel.value;
    render(D.filter(w => (!nd || w.node === nd) && (!kw || w.id.toLowerCase().includes(kw) || w.acc.includes(kw) || w.ip.includes(kw))));
  }
  document.getElementById('q-btn').onclick = apply;
  document.getElementById('f-kw').addEventListener('input', apply);
  nodeSel.onchange = apply;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const w = D[+b.dataset.i];
    document.getElementById('wt-title').textContent = `${w.id} · ${ND(w.node)}`;
    document.getElementById('wt-fields').innerHTML = Object.entries({
      '账号': w.acc, '设备ID': w.dev, 'IP地址': w.ip, '归属省份': w.prov, '近1h支付金额': w.amt1h ? '¥ ' + w.amt1h.toLocaleString() : '-',
      '近24h购买次数': w.cnt24h, '近24h去重IP': w.ip24h, '设备黑名单': w.black, '事件类型': w.type, '事件时间': w.time,
    }).map(([k, v]) => `<div class="kv-block"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    openModal('wt-modal');
  });

  fullRender();
})();
</script>
</body>
</html>
